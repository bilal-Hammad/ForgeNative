name: Forge
options:
  bundleIdPrefix: com.bilalhammad
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Forge
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: ForgeIconv1
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Real-device builds need these — previously only set via Xcode's own
    # Signing & Capabilities GUI, which xcodegen generate silently wipes on
    # every regeneration since project.yml is the actual source of truth.
    # Declaring it here is what makes real-device builds/tests survive a
    # regen instead of failing with "requires a development team."
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 53T98NLS49

targets:
  Forge:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Forge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilalhammad.forge.native
        PRODUCT_NAME: Forge
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ForgeIconv1
        CODE_SIGN_ENTITLEMENTS: Forge/Forge.entitlements
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Forge reads Health data to automatically mark HealthKit-tracked habits (like water intake, workouts, and sleep) complete when your data already meets your goal."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Forge writes to Health when you manually log a HealthKit-tracked habit, so your data stays in sync in both directions."
        # Required for `Activity.request` to succeed at all — the timer
        # feature's Live Activity/Dynamic Island presentation.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    dependencies:
      - target: ForgeWidgets
        embed: true

  # Widget extension whose sole purpose is the timer feature's Live
  # Activity (`HabitTimerLiveActivity`) — Dynamic Island + Lock Screen
  # presentation for a running time-unit habit's countdown. No home-screen
  # widgets are configured, just the one `ActivityConfiguration`.
  # `HabitTimerAttributes.swift`/`HabitColor.swift` are compiled directly
  # into this target too (see those files' own doc comments for why: no
  # shared framework for something this small).
  ForgeWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ForgeWidgets
      - path: Forge/Core/Timer/HabitTimerAttributes.swift
      - path: Forge/Core/Models/HabitColor.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilalhammad.forge.native.widgets
        PRODUCT_NAME: ForgeWidgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ForgeWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  # Kept permanently (confirmed) — this project's real gesture/interaction
  # regression suite. Originally added for the weekly-pager swipe
  # investigation (Simulator mouse-drag never registers as a page-swipe
  # gesture; XCUITest's real touch injection does) and now also used for
  # HealthKit system-consent-sheet interaction and other gesture-driven
  # features. See CLAUDE.md's Home weekly strip investigation history.
  ForgeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ForgeUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilalhammad.forge.native.uitests
    dependencies:
      - target: Forge
    testTargetID: Forge
