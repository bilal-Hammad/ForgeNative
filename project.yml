name: Forge
options:
  bundleIdPrefix: com.bilalhammad
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Forge
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: ForgeIconv1
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Forge:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Forge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilalhammad.forge.native
        PRODUCT_NAME: Forge
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ForgeIconv1
        CODE_SIGN_ENTITLEMENTS: Forge/Forge.entitlements
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Forge reads Health data to automatically mark HealthKit-tracked habits (like water intake, workouts, and sleep) complete when your data already meets your goal."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Forge writes to Health when you manually log a HealthKit-tracked habit, so your data stays in sync in both directions."

  # TEMPORARY — added for the weekly-pager swipe investigation, so a real
  # swipe gesture can be verified via actual touch injection (XCUITest),
  # since Simulator mouse-drag does not register as a page-swipe gesture in
  # this environment (see CLAUDE.md's Home weekly strip investigation
  # history). Remove this target and ForgeUITests/ once that's done, unless
  # the user wants to keep it for future gesture regressions.
  ForgeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ForgeUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilalhammad.forge.native.uitests
    dependencies:
      - target: Forge
    testTargetID: Forge
