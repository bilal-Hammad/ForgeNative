name: Forge
options:
  bundleIdPrefix: com.bilalhammad
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Forge
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: ForgeIconv1
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Real-device builds need these — previously only set via Xcode's own
    # Signing & Capabilities GUI, which xcodegen generate silently wipes on
    # every regeneration since project.yml is the actual source of truth.
    # Declaring it here is what makes real-device builds/tests survive a
    # regen instead of failing with "requires a development team."
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 53T98NLS49

# Third-party Swift packages. Adhan (batoulapps/adhan-swift, MIT) computes
# prayer + Sunnah times from real astronomical data — the foundation of the
# P1 prayer-relative habit feature. API verified against the 1.5.0 source
# before use.
packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift.git
    from: "1.5.0"

targets:
  Forge:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Forge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilalhammad.forge.native
        PRODUCT_NAME: Forge
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ForgeIconv1
        CODE_SIGN_ENTITLEMENTS: Forge/Forge.entitlements
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Forge reads Health data to automatically mark HealthKit-tracked habits (like water intake, workouts, and sleep) complete when your data already meets your goal."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Forge writes to Health when you manually log a HealthKit-tracked habit, so your data stays in sync in both directions."
        # Required for EKEventStore.requestFullAccessToEvents()/
        # requestFullAccessToReminders() to succeed at all — the real
        # Calendar/Reminders sync feature. Only the iOS 17+ "full access"
        # keys are needed (not the legacy NSCalendarsUsageDescription/
        # NSRemindersUsageDescription) since this project's deployment
        # target (26.0) never calls the deprecated pre-iOS-17 API.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Forge creates and updates Calendar events for habits you choose to sync, so they show up alongside the rest of your schedule."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Forge creates and completes Reminders for habits you choose to sync, so you can track them from the Reminders app too."
        # Required for `Activity.request` to succeed at all — the timer
        # feature's Live Activity/Dynamic Island presentation.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # When-in-use location for prayer-time calculation (P1 Phase 2).
        # Foreground/one-shot only — no background/"always" location.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Forge uses your location to calculate accurate prayer times for prayer-based habits. Your location is used on-device only and never leaves your phone."
    dependencies:
      - target: ForgeWidgets
        embed: true
      - package: Adhan

  # Widget extension whose sole purpose is the timer feature's Live
  # Activity (`HabitTimerLiveActivity`) — Dynamic Island + Lock Screen
  # presentation for a running time-unit habit's countdown. No home-screen
  # widgets are configured, just the one `ActivityConfiguration`.
  # `HabitTimerAttributes.swift`/`HabitColor.swift` are compiled directly
  # into this target too (see those files' own doc comments for why: no
  # shared framework for something this small).
  ForgeWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ForgeWidgets
      - path: Forge/Core/Timer/HabitTimerAttributes.swift
      - path: Forge/Core/Timer/SharedTimerStopSignal.swift
      - path: Forge/Core/Timer/SharedTimerPauseSignal.swift
      # Also compiled into the main Forge app target (via its `path: Forge`)
      # — a LiveActivityIntent's perform() is routed to the app's process, so
      # it must be a member of both targets (Apple's documented requirement;
      # extension-only was the "pause does nothing" bug). See the file's doc.
      - path: Forge/Core/Timer/ToggleTimerPauseIntent.swift
      - path: Forge/Core/Models/HabitColor.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilalhammad.forge.native.widgets
        PRODUCT_NAME: ForgeWidgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ForgeWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        # The Live Activity's interactive Stop button (`StopTimerIntent`)
        # runs in this extension's process and needs a tiny shared-
        # UserDefaults signal (`SharedTimerStopSignal`) to tell the main
        # app which habit's timer to cancel next time it's foregrounded —
        # see that type's doc comment for why an App Group, not a full
        # shared SwiftData store, was the chosen scope for this.
        CODE_SIGN_ENTITLEMENTS: ForgeWidgets/ForgeWidgets.entitlements

  # Kept permanently (confirmed) — this project's real gesture/interaction
  # regression suite. Originally added for the weekly-pager swipe
  # investigation (Simulator mouse-drag never registers as a page-swipe
  # gesture; XCUITest's real touch injection does) and now also used for
  # HealthKit system-consent-sheet interaction and other gesture-driven
  # features. See CLAUDE.md's Home weekly strip investigation history.
  ForgeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ForgeUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilalhammad.forge.native.uitests
    dependencies:
      - target: Forge
    testTargetID: Forge

  # Logic/unit tests (hosted in the Forge app so `@testable import Forge`
  # works). Added in P1 for the entitlement-resolution logic; also the home
  # for later pure-math tests the initiative needs (prayer-time accuracy in
  # Phase 2, point-in-time goal snapshot math in Phase 5) — the kind of
  # correctness that's far better checked with real assertions than with a
  # Simulator screenshot. Depending on the Forge application target makes
  # xcodegen wire TEST_HOST/BUNDLE_LOADER automatically.
  ForgeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ForgeTests
      # The StoreKit test config is bundled into the unit-test bundle so
      # `SKTestSession(configurationFileNamed: "Forge")` can drive real
      # StoreKit transactions through `StoreKitEntitlementService` on-device
      # (StoreKitEntitlementServiceTests). Same file the Run action attaches.
      - path: Configuration/Forge.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilalhammad.forge.native.unittests
    dependencies:
      - target: Forge

# Shared "Forge" scheme. Previously Xcode auto-created this (no shared scheme
# was in the repo); it's declared explicitly now so the local StoreKit
# configuration is attached to the Run action for on-device/Simulator sandbox
# testing of purchases without live App Store Connect products. The test
# action must keep BOTH test targets so `xcodebuild test -scheme Forge
# -only-testing:ForgeUITests/...` (used to verify every phase) still works.
schemes:
  Forge:
    build:
      targets:
        Forge: all
        ForgeTests: [test]
        ForgeUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Configuration/Forge.storekit
    test:
      config: Debug
      targets:
        - ForgeTests
        - ForgeUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
